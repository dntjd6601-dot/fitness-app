<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스쿼트 타이머 & 대결</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #856404;
      --accent-light: #d4edda;
      --primary-btn: #856404;
      --primary-btn-hover: #634a02;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      text-align: center;
      margin-top: 0;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #e0a800;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #c69500;
    }

    .btn-secondary {
      background-color: #444;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #555;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    /* Modal Style */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      width: 85%;
      max-width: 400px;
      text-align: center;
    }

    .share-box {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      word-break: break-all;
      font-size: 14px;
      border: 1px dashed #666;
    }

    .code-display {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #ffc107;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🔥 스쿼트 배틀</h1>

  <!-- 방 생성 / 입장 폼 -->
  <div id="room-selection" class="card">
    <h2>대결 시작하기</h2>
    <input type="text" id="user-name" placeholder="닉네임 입력">
    
    <button class="btn" onclick="createRoom()">새 방 만들기</button>
    
    <hr style="border-color: #333; margin: 20px 0;">
    
    <input type="text" id="room-code-input" placeholder="참여 코드 입력 (6자리)">
    <button class="btn btn-secondary" onclick="joinRoom()">방 입장하기</button>
  </div>
</div>

<!-- 방 생성 성공 모달 -->
<div id="share-modal" class="modal-overlay">
  <div class="modal-content">
    <h3>🎉 방이 생성되었습니다!</h3>
    <p>친구에게 코드를 공유해 보세요.</p>
    
    <div><strong>참여 코드</strong></div>
    <div id="modal-code" class="code-display">------</div>
    <button class="btn btn-secondary" style="padding: 6px; font-size: 12px;" onclick="copyCode()">코드 복사</button>
    
    <div style="margin-top: 15px;"><strong>공유용 전체 링크</strong></div>
    <div id="modal-link" class="share-box">https://...</div>
    <button class="btn" onclick="copyLink()">전체 링크 복사</button>
    <button class="btn btn-secondary" onclick="closeModalAndStart()" style="margin-top: 15px;">입장하기</button>
  </div>
</div>

<script>
  // Firebase Realtime DB URL (싱가포르 리전 적용)
  const FIREBASE_DB_URL = "https://fitness-6a8e0-default-rtdb.asia-southeast1.firebasedatabase.app";

  let currentRoomCode = "";
  let currentUserName = "";

  // 페이지 로드 시 URL 파라미터 체크 (초대 링크 대응)
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('room');
    if (codeParam) {
      document.getElementById('room-code-input').value = codeParam;
    }
  };

  // 랜덤 6자리 코드 생성
  function generateRoomCode() {
    return Math.floor(100000 + Math.random() * 900000).toString();
  }

  // 방 만들기
  async function createRoom() {
    const name = document.getElementById('user-name').value.trim();
    if (!name) {
      alert("닉네임을 입력해 주세요.");
      return;
    }

    currentUserName = name;
    currentRoomCode = generateRoomCode();

    const initialData = {
      createdAt: Date.now(),
      players: {
        [name]: { count: 0, status: "ready" }
      }
    };

    try {
      const response = await fetch(`${FIREBASE_DB_URL}/rooms/${currentRoomCode}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(initialData)
      });

      if (!response.ok) throw new Error("방 생성 실패");

      // 모달에 정보 표시
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
      document.getElementById('modal-code').innerText = currentRoomCode;
      document.getElementById('modal-link').innerText = shareUrl;
      document.getElementById('share-modal').style.display = 'flex';

    } catch (err) {
      alert("네트워크 연결 오류: " + err.message);
    }
  }

  // 방 참여하기
  async function joinRoom() {
    const name = document.getElementById('user-name').value.trim();
    const code = document.getElementById('room-code-input').value.trim();

    if (!name || !code) {
      alert("닉네임과 참여 코드를 모두 입력해 주세요.");
      return;
    }

    try {
      const response = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`);
      const roomData = await response.json();

      if (!roomData) {
        alert("존재하지 않는 방입니다.");
        return;
      }

      currentUserName = name;
      currentRoomCode = code;

      // 사용자 추가
      await fetch(`${FIREBASE_DB_URL}/rooms/${code}/players/${name}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count: 0, status: "ready" })
      });

      alert(`${code}번 방에 입장했습니다!`);
      // 대결 화면으로 이동하는 로직 구현 가능

    } catch (err) {
      alert("입장 중 오류 발생: " + err.message);
    }
  }

  // 코드 복사
  function copyCode() {
    navigator.clipboard.writeText(currentRoomCode);
    alert("참여 코드가 복사되었습니다.");
  }

  // 링크 복사
  function copyLink() {
    const linkText = document.getElementById('modal-link').innerText;
    navigator.clipboard.writeText(linkText);
    alert("공유 링크가 복사되었습니다.");
  }

  // 모달 닫기
  function closeModalAndStart() {
    document.getElementById('share-modal').style.display = 'none';
    // 방 입장 후 게임 대기 화면 처리 추가 가능
  }
</script>

</body>
</html>
